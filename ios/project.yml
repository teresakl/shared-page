name: CoupleCalendar
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  CoupleCalendar:
    type: application
    platform: iOS
    dependencies:
      - target: CalendarWidget
    sources:
      - path: Sources
        excludes:
          - "**/*.bak*"
          - "*.bak*"
      # 小组件的视图+取数,主 app 也编译 —— -widgetProbe 靠它把卡片渲染成 PNG 验收
      - path: Widget/WidgetShared.swift
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/*.bak*"
    entitlements:
      path: Sources/CoupleCalendar.entitlements
      properties:
        aps-environment: development
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # 资源会被拍平到 bundle 根，这里必须是纯文件名，带 Fonts/ 前缀会注册失败
        UIAppFonts:
          - LXGWWenKai-Regular.ttf
          - InstrumentSerif-Regular.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
          - Caveat-Medium.ttf
        CFBundleURLTypes:
          - CFBundleURLName: "com.example.couplecalendar"
            CFBundleURLSchemes:
              - ourcalendar
    settings:
      base:
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.couplecalendar
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Couple Calendar
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用来把你选的照片贴进日历里。"
        INFOPLIST_KEY_NSCameraUsageDescription: "用来直接拍一张贴进日历里。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # 桌面小组件:中号一种,今天的日程+便签。
  # 独立小程序,字体要在自己的 Info 里再登记一遍,不然手写体出不来
  CalendarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/CalendarSecrets.swift
      - path: Resources/Fonts
        buildPhase: resources
      # 便签纸和胶带素材要进小组件自己的包(extension 读不到主 app 的资源)
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - LXGWWenKai-Regular.ttf
          - InstrumentSerif-Regular.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
          - Caveat-Medium.ttf
    settings:
      base:
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.example.couplecalendar.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Couple Calendar
        SKIP_INSTALL: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  CoupleCalendar:
    build:
      targets:
        CoupleCalendar: all
    run:
      config: Debug
    archive:
      config: Release
